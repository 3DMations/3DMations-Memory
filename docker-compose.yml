services:
  # Digest pins (audit 2026-10-10): image tags drift; digests don't.
  # tailscale/tailscale:latest @ c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
  # postgres:18-alpine      @ 77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
  # node:22-alpine          @ 0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 (in Dockerfile)
  # Bump deliberately via `docker buildx imagetools inspect <image>` + commit.
  ts-hub:
    image: tailscale/tailscale:latest@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: hub-ts
    hostname: hub
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: --advertise-tags=tag:hub
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      # Exposes /healthz on 127.0.0.1:9999 inside the container — used by the
      # healthcheck so `app` waits for an authenticated tailscaled, not just a
      # started one.
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - hub-ts-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hub-internal
      - jarvis-internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hub-app
    restart: unless-stopped
    # Security audit 2026-10-10: per-service env allowlist. The old
    # `env_file: .env` injected TS_AUTHKEY/AUTH_SECRET/POSTGRES_PASSWORD into
    # every container — including Postgres, which needs none of them.
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      HUB_ADMIN_LOGIN: ${HUB_ADMIN_LOGIN}
      AI_FEATURES_ENABLED: ${AI_FEATURES_ENABLED}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    # PRODUCTION runtime (audit 2026-10-10): the multi-stage image ships the
    # prebuilt standalone server (`node server.js`, loopback bind baked in via
    # HOSTNAME=127.0.0.1). No source bind-mount, no at-start `pnpm build` —
    # deploys are `make up` (docker compose build) and restarts are instant.
    # For active dev iteration with HMR, use the app-debug profile on localhost.
    # Loopback bind (security audit 2026-10-10): the socket is reachable ONLY
    # inside ts-hub's netns at 127.0.0.1:3000 — what serve.json proxies to.
    # Binding 0.0.0.0 here would also expose :3000 on ts-hub's jarvis-internal
    # bridge IP, letting any container on that shared network bypass Tailscale
    # entirely and spoof Tailscale-User-Login. Loopback makes "tailnet is the
    # only ingress" enforced, not assumed.
    # Hardening: no privilege escalation, zero caps (Node needs none),
    # read-only rootfs (the standalone server writes nothing at runtime),
    # capped resources. /tmp is tmpfs because the rootfs is read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1536m
    cpus: 1.5
    network_mode: service:ts-hub
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      ts-hub:
        condition: service_healthy

  # Debug profile (Phase 3a O4=a): emergency local-only access when tailnet is
  # unreachable. Mutually exclusive with `app` (shared volumes — DO NOT run both).
  # Bring up: `docker compose stop app && docker compose --profile debug up -d app-debug`
  # Tear down: `docker compose --profile debug down app-debug && docker compose up -d app`
  app-debug:
    profiles: [debug]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hub-app-debug
    restart: unless-stopped
    # Same env allowlist as `app` — no secret spread (audit 2026-10-10).
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      HUB_ADMIN_LOGIN: ${HUB_ADMIN_LOGIN}
      AI_FEATURES_ENABLED: ${AI_FEATURES_ENABLED}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1536m
    cpus: 1.5
    volumes:
      - ./app:/app
      - hub-node-modules:/app/node_modules
      - hub-next-cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hub-internal

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: hub-db
    restart: unless-stopped
    # Postgres entrypoint needs these caps to chown its data dir and drop
    # privileges to the postgres user; everything else dropped.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PG18+ uses major-version subdirs under /var/lib/postgresql.
      # Mounting /data is rejected as "unused" — mount the parent instead.
      - hub-db-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hub-internal

volumes:
  hub-db-data:
  hub-node-modules:
  hub-next-cache:
  hub-ts-state:

networks:
  hub-internal:
    driver: bridge
  jarvis-internal:
    external: true
